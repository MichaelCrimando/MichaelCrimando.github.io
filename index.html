<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Is the OTA today?</title>
<style>
  :root { --cooldown-ms: 64800000; } /* 18 hours */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d0d10;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 32px;
    user-select: none;
  }
  h1 { font-size: clamp(28px, 6vw, 56px); margin: 0; font-weight: 800; letter-spacing: -0.5px; }
  #answer {
    font-size: clamp(40px, 12vw, 120px);
    font-weight: 900;
    min-height: 1.2em;
    line-height: 1.2;
    transition: opacity 0.2s ease;
  }
  #button {
    border: none;
    border-radius: 50%;
    width: min(60vw, 260px);
    height: min(60vw, 260px);
    background: radial-gradient(circle at 35% 30%, #ff5a5a, #c40000 70%, #7a0000);
    color: #fff;
    font-size: clamp(20px, 5vw, 34px);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 0 #5a0000, 0 14px 30px rgba(0,0,0,0.6);
    transition: transform 0.05s ease, box-shadow 0.05s ease, filter 0.2s ease;
    text-transform: uppercase;
  }
  #button:active:not(:disabled) {
    transform: translateY(8px);
    box-shadow: 0 2px 0 #5a0000, 0 6px 16px rgba(0,0,0,0.6);
  }
  #button:disabled {
    filter: grayscale(0.7) brightness(0.6);
    cursor: not-allowed;
    box-shadow: 0 10px 0 #333, 0 14px 30px rgba(0,0,0,0.6);
  }
  #cooldown { font-size: clamp(14px, 3vw, 18px); color: #9a9a9a; min-height: 1.4em; }
  .hit { animation: pop 0.35s ease; }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  footer { position: fixed; bottom: 10px; font-size: 12px; color: #555; }
</style>
</head>
<body>
  <h1>Is the OTA today?</h1>
  <div id="answer"></div>
  <button id="button">Check</button>
  <div id="cooldown"></div>
  <footer>refresh doesn't help. nice try.</footer>

<script>
(function () {
  const COOLDOWN_MS = 18 * 60 * 60 * 1000; // 18 hours
  const KEY_TIME = "ota_last_press";
  const KEY_ANSWER = "ota_last_answer";

  // 1 in 100 chance of YES. Everything else is a letdown.
  const LETDOWNS = [
    "No.", "Nope.", "Not today.", "Maybe.", "lol no",
    "Ask again tomorrow.", "Soon\u2122", "Delayed again.",
    "Almost. (No.)", "Not a chance.", "Still no.", "Definitely maybe not.",
  ];

  const answerEl = document.getElementById("answer");
  const btn = document.getElementById("button");
  const cooldownEl = document.getElementById("cooldown");
  let timerId = null;

  function roll() {
    if (Math.floor(Math.random() * 100) === 0) return "YES!!! \uD83C\uDF89";
    return LETDOWNS[Math.floor(Math.random() * LETDOWNS.length)];
  }

  function fmt(ms) {
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return String(h).padStart(2, "0") + "h " +
           String(m).padStart(2, "0") + "m " +
           String(sec).padStart(2, "0") + "s";
  }

  function showAnswer(text, animate) {
    answerEl.textContent = text;
    if (animate) {
      answerEl.classList.remove("hit");
      void answerEl.offsetWidth; // reflow to restart animation
      answerEl.classList.add("hit");
    }
  }

  function tick() {
    const last = parseInt(localStorage.getItem(KEY_TIME) || "0", 10);
    const remaining = last + COOLDOWN_MS - Date.now();

    if (remaining > 0) {
      btn.disabled = true;
      btn.textContent = "On cooldown";
      cooldownEl.textContent = "Come back in " + fmt(remaining);
    } else {
      btn.disabled = false;
      btn.textContent = "Check";
      cooldownEl.textContent = "";
      if (timerId) { clearInterval(timerId); timerId = null; }
    }
  }

  function press() {
    const last = parseInt(localStorage.getItem(KEY_TIME) || "0", 10);
    if (last + COOLDOWN_MS - Date.now() > 0) return; // still cooling down

    const answer = roll();
    localStorage.setItem(KEY_TIME, String(Date.now()));
    localStorage.setItem(KEY_ANSWER, answer);
    showAnswer(answer, true);
    if (!timerId) timerId = setInterval(tick, 1000);
    tick();
  }

  // Restore last answer on load (survives refresh)
  const saved = localStorage.getItem(KEY_ANSWER);
  if (saved) showAnswer(saved, false);

  btn.addEventListener("click", press);
  tick();
  if (btn.disabled) timerId = setInterval(tick, 1000);
})();
</script>
</body>
</html>
